{% extends "base.html" %}

{% block title %}500 Server Error — ML LabVerse{% endblock %}
{% block page_title %}Server Error{% endblock %}

{% block content %}
<div class="card-panel" style="text-align: center; padding: 60px 20px;">
  <div style="font-size: 3.5rem; font-weight: 800; color: var(--color-peach-text); margin-bottom: 8px;">500</div>
  <h2 style="font-size: 1.3rem; margin-bottom: 8px;">Internal Server Exception</h2>
  <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px;">An unexpected error occurred while executing the server request.</p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
    <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i>
    <span>Return to Dashboard</span>
  </a>
</div>
{% endblock %}
